quarkus.http.cors=true
quarkus.http.cors.exposed-headers=X-Openttd-Server-Session-Id,X-OPENTTD_SERVER_SESSION_ID

openttd.save.dir=/tmp/openttd/save
openttd.config.dir=/tmp/openttd/config
server.config.dir=/tmp/openttd
openttd.root.dir=/home/openttd/openttd-15

# The shutdown observer saves every running server before it stops it, which needs more than the default 1s budget.
# Keep this below the 'docker stop' grace period (see README, use --stop-timeout / stop_grace_period).
quarkus.shutdown.timeout=50s

# Time a '/data-stream' connection gets to send its subscribe message before it is closed as unauthorized
#server.websocket.auth-timeout-ms=5000
# Optional check of the 'Origin' header of a '/data-stream' handshake. Off by default, the session id in the first
# frame of the socket is the protection. 'allowed-origins' is a comma separated list, e.g. https://openttd.example.com
#server.websocket.check-origin=false
#server.websocket.allowed-origins=

quarkus.package.type=mutable-jar
quarkus.live-reload.password=Password_1
quarkus.live-reload.url=http://localhost:8080


