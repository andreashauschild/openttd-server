# Configuration of the '%test' profile, i.e. of every @QuarkusTest. Everything the application needs at startup is
# pointed at 'target/test-data' so that a test run never touches a real save game or config.
%test.start-server.command=sh; -c; cat
%test.openttd.save.dir=target/test-data/save
%test.openttd.config.dir=target/test-data/config
%test.server.config.dir=target/test-data
%test.openttd.root.dir=target/test-data/openttd

# The tests log in with 'admin:Password_1'
%test.server.initial.password=Password_1
%test.server.disable.security=false

# No OpenTTD process may be started or stopped behind the back of a test
%test.server.auto-start-running-servers=false
%test.quarkus.scheduler.enabled=false

# A test must not wait 5 seconds for an unauthenticated websocket to be closed
%test.server.websocket.auth-timeout-ms=500
