name: Docker image

on:
  workflow_call:
    inputs:
      push:
        description: 'Push the built images to Docker Hub'
        required: true
        type: boolean
      platforms:
        description: 'Comma separated list of platforms to build'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      tag:
        description: 'Explicit image tag to publish. Empty means the default tags derived from the git ref.'
        required: false
        default: ''
        type: string

env:
  IMAGE: hauschi86/openttd-server

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
      - name: Upload quarkus-app
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-app
          path: target/quarkus-app
          retention-days: 1
          if-no-files-found: error

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build the platform matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          matrix="$(jq -cn --arg platforms "$PLATFORMS" '
            ($platforms | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $wanted
            | [
                {"platform": "linux/amd64", "runner": "ubuntu-latest"},
                {"platform": "linux/arm64", "runner": "ubuntu-24.04-arm"}
              ]
            | map(select(.platform as $p | $wanted | index($p)))
            | {"include": .}
          ')"
          if [ "$(jq -r '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "No supported platform in '$PLATFORMS' (supported: linux/amd64, linux/arm64)" >&2
            exit 1
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  image:
    needs: [ maven, prepare ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download quarkus-app
        uses: actions/download-artifact@v4
        with:
          name: quarkus-app
          path: target/quarkus-app
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr / - >> "$GITHUB_ENV"
      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # An empty 'tags' input makes docker/metadata-action fall back to its default tag types.
          if [ -n "$TAG" ]; then
            echo "tags=type=raw,value=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ steps.tags.outputs.tags }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Export digest
        if: inputs.push
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    if: inputs.push
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # An empty 'tags' input makes docker/metadata-action fall back to its default tag types.
          if [ -n "$TAG" ]; then
            echo "tags=type=raw,value=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ steps.tags.outputs.tags }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
